# ── Dengan Domain + HTTPS ────────────────────────────────────
# Simpan di: /etc/nginx/sites-available/smart-aiot
# Aktifkan:  ln -s /etc/nginx/sites-available/smart-aiot /etc/nginx/sites-enabled/
# SSL:       sudo certbot --nginx -d api.smartaiot.com

server {
    listen 80;
    server_name api.smartaiot.com;   # <-- GANTI dengan domain kamu

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.smartaiot.com;   # <-- GANTI dengan domain kamu

    # SSL (otomatis diisi oleh certbot)
    ssl_certificate     /etc/letsencrypt/live/api.smartaiot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smartaiot.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API & general proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # WebSocket proxy
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
